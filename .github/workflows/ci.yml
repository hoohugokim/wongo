name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/wongo tests tools
      - name: Test
        run: pytest -q
      - name: CLI smoke
        run: |
          wongo --version
          wongo profile list
          wongo profile verify est --offline
          wongo profile show est
          wongo style list

  e2e:
    # Real Quarto and R, the example manuscript, and a Hangul folder name:
    # the path a new lab member takes on Windows, macOS, and Linux.
    name: end-to-end render (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            folder: 원고 예제
          - os: macos-latest
            folder: 원고 예제
          # Windows runners use code page cp1252, which has no Hangul; Quarto
          # cannot render there (see the next step), so the full flow runs in
          # an ASCII folder with a space in its name.
          - os: windows-latest
            folder: wongo example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: R packages
        # no repos= override: setup-r points Linux at Posit's binary mirror
        run: Rscript -e "install.packages(c('knitr', 'rmarkdown', 'jsonlite'))"
      - name: Install wongo
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Example manuscript, first render to coauthor round-trip
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          wongo scaffold "${{ matrix.folder }}" --example
          cd "${{ matrix.folder }}"
          wongo doctor
          wongo check --strict
          wongo render --target collab
          wongo render --target submission
          wongo status
          wongo status --json > status.json
          wongo roundtrip output/main-collab.docx --json > roundtrip.json
          wongo diff output/main-collab.docx output/main-submission.docx -o output/compare.docx
          python - <<'PY'
          import json
          import zipfile
          status = json.load(open("status.json", encoding="utf-8"))["status"]
          for target in ("collab", "submission"):
              assert status["outputs"][target]["state"] == "fresh", status["outputs"]
          roundtrip = json.load(open("roundtrip.json", encoding="utf-8"))
          assert roundtrip["ok"] and roundtrip["changes"] == 0, roundtrip
          with zipfile.ZipFile("output/main-collab.docx") as z:
              assert "<w:trackRevisions/>" in z.read("word/settings.xml").decode()
          with zipfile.ZipFile("output/si-submission.docx") as z:
              assert "Contents: 1 figures, 1 tables" in z.read("word/document.xml").decode()
          print("e2e OK")
          PY
      - name: A Hangul folder on a cp1252 Windows is refused with the fix, not a Quarto crash
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP"
          wongo scaffold "원고 예제" --example
          cd "원고 예제"
          if wongo render --target collab 2> render-err.txt; then
            echo "render should have been refused"; exit 1
          fi
          grep -q "system code page (cp1252)" render-err.txt
          grep -q "Move or rename the project folder" render-err.txt
          if wongo doctor > doctor.txt; then
            echo "doctor should report the folder"; exit 1
          fi
          grep -q "\[FAIL\] HARD project-path" doctor.txt
          echo "refusal OK"

  build:
    name: wheel + sdist build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Wheel carries package data
        run: |
          python - <<'PY'
          import zipfile, pathlib
          whl = next(pathlib.Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(whl).namelist()
          required = [
              "wongo/assets/scaffold/_journal.yml",
              "wongo/assets/scaffold/.vscode/tasks.json",
              "wongo/assets/scaffold/AGENTS.md.tmpl",
              "wongo/assets/scaffold-example/index.qmd",
              "wongo/styles/kist-wcr.yml",
              "wongo/profiles/est/profile.yml",
              "wongo/profiles/est/assets/reference.docx",
              "wongo/profiles/wr/assets/elsevier-harvard.csl",
          ]
          missing = [n for n in required if n not in names]
          assert not missing, f"missing from wheel: {missing}"
          print(f"OK: {whl.name} carries all package data ({len(names)} files)")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
