figures:
  placement: inline          # VERIFIED: "Suitably high resolution figures may be inserted within the text at appropriate positions or grouped at the end" (initial submission); final figures embedded/cited in text order
  color_policy: "Initial submission ('for peer review'): figures incorporated in the manuscript file at >=300 dpi, 'clearly legible'; acceptable formats .ai, .eps, .pdf, .ps, .psd, .jpeg, .tiff, .png, .gif, .ppt, .pptx, .cdx. Final publication ('for publication'): RGB color, >=300 dpi; sans-serif typeface (Arial or Helvetica) for all figure lettering, optimum 8pt at final print size; preferred vector formats .ai/.eps/.pdf/.ps/.svg (editable layered .psd/.tif also accepted; bitmap .psd/.tif/.png/.jpg; .ppt if fully editable; ChemDraw .cdx for chemical structures); avoid red-green contrast, avoid rainbow color scale, recolor for colorblind accessibility; multi-panel figures on a single page labeled a), b), c); scale bars (not magnification factors); thinnest lines >=1 pt."   # VERIFIED
