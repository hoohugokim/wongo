# Environmental Microbiome (BMC, part of Springer Nature) — machine-readable
# profile. ONLY verified values; nulls await the TO VERIFY queue in SKILL.md.
# Contract: quarto-manuscript-sci/references/journal-profile-contract.md
journal: "Environmental Microbiome"
slug: envmicrobiome
publisher: "BMC (BioMed Central), part of Springer Nature — journal platform migrated from environmentalmicrobiome.biomedcentral.com to link.springer.com/journal/40793 ('BMC journals have moved to Springer Nature Link')"
submission_portal: https://submission.springernature.com/new-submission/40793/3  # resolved target of the "Submit your manuscript" link on the journal homepage / submission-guidelines page
manuscript_types:
  - {type: research, word_limit: null, counting_rule: "NO stated main-text word limit anywhere in the fetched Research article-type page (only the abstract is capped). Structure: Title page / Abstract (<=350 words, MUST be structured: Background / Results / Conclusions) / Keywords (3-10) / Background / Methods (may instead be placed after Conclusions) / Results / Discussion / Conclusions / List of abbreviations / Declarations / Endnotes (optional) / References. Additional journal-specific 'Criteria' requirements (beyond generic BMC formatting) apply: (1) data/metadata/analysis-script availability incl. MixS-formatted metadata per the Genome Standards Consortium; (2) mandatory sampling/extraction/PCR negative controls AND positive (mock-community) controls, sequenced and deposited publicly; (3) microbial-taxon names italicized per ASM/Journal of Bacteriology convention; (4) '16S rRNA gene' terminology (not '16S'/'16S rDNA'); (5) compositionally-aware statistics for any network analysis.", abstract_rule: "structured, <=350 words: Background / Results / Conclusions; minimize abbreviations; no references cited in the abstract"}
  - {type: review, word_limit: null, counting_rule: "NO stated main-text word limit. IMPORTANT: 'Environmental Microbiome no longer considers unsolicited reviews' (verbatim, Review article-type page) — this type is effectively commissioned-only; do not plan an unsolicited Review submission without first confirming invited status with the editors. Structure: Title page / Abstract (<=350 words, UNSTRUCTURED — no Background/Results/Conclusions subheadings, unlike Research) / Keywords / Main text (free subsections) / Conclusions / List of abbreviations / Declarations / Endnotes / References. No MixS/experimental-controls 'Criteria' section on this page (those apply to Research/Methodology/Brief report only).", abstract_rule: "unstructured, <=350 words; minimize abbreviations; no references cited in the abstract"}
  - {type: methodology, word_limit: null, counting_rule: "NO stated main-text word limit. Criteria: must describe a new (or demonstrably improved) experimental/computational method with a demonstrable advance over what is currently available, well tested. Same section structure and MixS/experimental-controls/nomenclature/terminology/network-analysis 'Criteria' requirements as Research (Discussion section for this type should cover practical/operational issues of performing the method).", abstract_rule: "structured, <=350 words: Background / Results / Conclusions; minimize abbreviations; no references cited in the abstract"}
  - {type: brief-report, word_limit: null, counting_rule: "NO stated main-text word limit. Criteria: extends previously published research — additional controls/confirmatory results in other settings, negative results, small-scale studies, audits, case series; authors must acknowledge the work they build on. Same section structure and MixS/experimental-controls/nomenclature/terminology/network-analysis 'Criteria' requirements as Research. NOTE: this is the closest BMC equivalent to a generic 'short report' type — the journal does not use the label 'Short report'.", abstract_rule: "structured, <=350 words: Background / Results / Conclusions; minimize abbreviations; no references cited in the abstract"}
  - {type: software, word_limit: null, counting_rule: "NO stated main-text word limit. Criteria: must describe a tool of broad utility representing a significant advance over previously published software, usually shown by direct comparison. Structure: Title page / Abstract (<=350 words, structured Background/Results/Conclusions) / Keywords / Background / Implementation / Results (may combine with Discussion) / Discussion (if appropriate) / Conclusions / Availability and requirements (Project name, Project home page, Operating system(s), Programming language, Other requirements, License, Any restrictions to use by non-academics) / List of abbreviations / Declarations / Endnotes / References. Has data/experimental-controls/terminology/network-analysis 'Criteria' subsections but NOT the MixS-metadata clause (that clause is Research/Methodology/Brief-report specific).", abstract_rule: "structured, <=350 words: Background / Results / Conclusions; minimize abbreviations; no references cited in the abstract"}
  - {type: perspective, word_limit: null, counting_rule: "NO stated main-text word limit. Purpose: 'focus attention on important issues... provoke discussion' via new hypotheses, alternative interpretations, or new proposals — not a primary-data research report. Structure: Title page (explicitly includes a verbatim LLM-authorship-criteria clause on this page) / Abstract (<=350 words, structured background/main-body/conclusion prose paragraph, not Background/Results/Conclusions subheadings) / Keywords / Background / Main text / Conclusions / List of abbreviations / Declarations (this page's own Declarations list spells the heading 'Availability of data and materials', with the plural 'materials', unlike the singular 'material' used in the Declarations heading list on Research/Methodology/Brief-report/Software/Comment/Correspondence/Meeting-report pages -- both point to the same underlying requirement; BMC's own pages are internally inconsistent on this spelling) / Endnotes / References. Also mentions searchRxiv for preserving search strings and BMC Research Notes data-note co-submission -- Perspective-specific extras not present on other type pages.", abstract_rule: "structured (background / main body / conclusion prose), <=350 words; minimize abbreviations; no references cited in the abstract"}
  - {type: comment, word_limit: null, counting_rule: "NO stated main-text word limit. Criteria: short, narrowly focused, usually commissioned by the journal, not minireviews; either (a) discussion of a recently/soon-to-be-published article, or (b) editorial-style commentary on an issue relevant to the journal's scope. Structure: Title page / Abstract (<=350 words, structured background/main-body/conclusion) / Keywords / Background / Main text / Conclusions / List of abbreviations / Declarations / Endnotes / References.", abstract_rule: "structured (background / main body / conclusion prose), <=350 words; minimize abbreviations; no references cited in the abstract"}
  - {type: correspondence, word_limit: null, counting_rule: "NO stated word limit anywhere (main text or abstract). Criteria: 'a substantial re-analysis of a previously published article in Environmental Microbiome or another journal'; may be edited for length/clarity; peer review at editors' discretion, EXCEPT 'short reports of research work will be peer reviewed'. Structure: Title page / Abstract (unstructured, no word cap stated) / Keywords / Main text / List of abbreviations / Declarations / Endnotes / References -- NO Conclusions heading (unlike Research/Methodology/Brief-report/Software/Perspective/Comment).", abstract_rule: "unstructured, no word limit stated; brief summary of aim/findings/purpose; minimize abbreviations; no references cited in the abstract"}
  - {type: meeting-report, word_limit: null, counting_rule: "NO stated word limit anywhere. Criteria: focuses on key developments discussed at a meeting, not a fully referenced field review; prefer in-depth coverage of a few selected topics over a brief account of everything; usually commissioned, but reports/suggestions may be submitted for editors' consideration. Structure identical to Correspondence: Title page / Abstract (unstructured) / Keywords / Main text / List of abbreviations / Declarations / Endnotes / References -- no Conclusions heading.", abstract_rule: "unstructured, no word limit stated; brief summary of aim/findings/purpose; minimize abbreviations; no references cited in the abstract"}
csl: assets/biomed-central.csl                  # VERIFIED: fetched from the official CSL styles repo 2026-07-04. Zotero/CSL "BioMed Central" style (numeric in-text citation-format; et-al-min=7/et-al-use-first=6, matching this journal's own worked reference examples, e.g. 6 named authors + "et al." in the "Article within a journal (no page numbers)" example). No environmental-microbiome-specific CSL exists (confirmed 404 for that filename in the repo). The journal's own Research/Review/etc. pages label their worked examples "the BioMed Central reference style"; the Perspective page alone labels the identical example block "the Vancouver reference style" -- both names refer to the same numbered, square-bracket, BMC-house Vancouver-family style this CSL implements. The CSL's own documentation link points to a BMC journal's own preparing-your-manuscript/research-article page, i.e. this exact house style family.
reference_doc: assets/reference.docx             # generated by scripts/build_reference_docx.py — never hand-edit
section_headings: [Title page, Abstract, Keywords, Background, Methods, Results, Discussion, Conclusions, List of abbreviations, Declarations, Endnotes, References]  # VERIFIED: Research article-type page (this journal's flagship/default type); Methods "may also be placed after [the] Conclusion section" per the same page. Other article types substitute/drop sections per their own manuscript_types[].counting_rule above (e.g. Software inserts Implementation/Availability and requirements; Correspondence and Meeting report drop Conclusions and use a plain Main text section instead of Background/Methods/Results/Discussion).
line_numbers: true           # VERIFIED: "Include line and page numbering" (Submission guidelines > Prepare your manuscript > Preparing main manuscript text > Quick points)
spacing: double              # VERIFIED: "Use double-line spacing" (same Quick points list)
blinding: single             # VERIFIED: "Environmental Microbiome operates a single-anonymous peer review system, where the reviewers are aware of the names and affiliations of the authors, but the reviewer reports provided to authors are anonymous." (Submission guidelines > Peer review policy; corroborated verbatim on the journal's own Ethics & disclosures page: "Research content published in this journal is peer reviewed (single-anonymous).") No double-anonymized opt-in of any kind is mentioned on any fetched Environmental-Microbiome-specific page.
toc_graphic:                 # VERIFIED ABSENT, recorded explicitly (not left null) per this profile's authoring brief
  required: false            # VERIFIED: no TOC graphic / graphical abstract / visual abstract / synopsis-graphic concept of any kind appears anywhere in Aims and scope, Submission guidelines (general + all 9 article-type subpages), Prepare supporting information, Ethics and disclosures, How to publish with us, or the BMC-wide Editorial policies page — this journal (and BMC's own submission template generally) has no such concept
  width_mm: null
  height_mm: null
  min_dpi: null
  formats: []
  synopsis_words: null
  label: null
  manuscript_placement: null
si:
  separate_file: true        # VERIFIED: each item is its own upload -- "Additional file 1", "Additional file 2", etc. -- not one merged SI document (unlike the Nature-brand "single combined PDF" convention seen in sibling profiles)
  page_prefix: null          # NOT APPLICABLE rather than unconfirmed: BMC "Additional files" are standalone uploaded files (datasets/tables/movies/etc.), not pages within a merged, internally paginated SI document, so an S1/S2-style page-numbering convention does not apply to this journal's SI model. Re-verify if a future check finds this journal has changed to a merged-PDF SI model.
  needs_own_toc: false       # VERIFIED ABSENT: no internal table of contents for additional files is mentioned anywhere in "Preparing additional files" (Submission guidelines) or Prepare supporting information
  needs_cover_sheet: false   # VERIFIED ABSENT: no separate SI cover-sheet document (authors/title/counts) is mentioned; instead a manifest (file name, file format, title, description) is required INSIDE the main manuscript text itself -- see manifest_required_in_main_text below
  pdf_only: false            # VERIFIED: additional files explicitly include non-PDF formats -- movies, Excel (.xls) or comma-separated (.csv) tabular data, "or other information as additional files"
  naming: "'Additional file 1', 'Additional file 2', etc. (BMC's own term is 'Additional files', NOT 'Supplementary Information'/'Supplementary Material'); each must be cited explicitly by file name in the main body text, e.g. \"An additional movie file shows this in more detail [see Additional file 1]\""   # VERIFIED (BMC-specific extension key beyond the base contract schema)
  max_file_size_mb: 20       # VERIFIED (extension key): "The maximum file size for additional files is 20 MB each, and files will be virus-scanned on submission."
  manifest_required_in_main_text: true  # VERIFIED (extension key): authors must list File name / File format (with extension) / Title of data / Description of data "in a separate section of the manuscript text" for every additional file
figures:
  placement: end              # BEST FIT, not a clean match: BMC figures are uploaded as separate graphic files (not embedded inline in the Word/LaTeX manuscript document) -- only the figure TITLE (<=15 words) and LEGEND (<=300 words) live in the main manuscript text ("provided in the main manuscript, not in the graphic file"); figures are numbered/uploaded in first-mention order. Treat this field as informational only per the base contract, not a literal inline-vs-end instruction.
  color_policy: "VERIFIED (Submission guidelines > Prepare your manuscript > Preparing illustrations and figures): figures numbered in first-mention order and uploaded in that order; multi-panel figures (a, b, c, d...) submitted as ONE composite file; correct orientation required; figure titles <=15 words and legends <=300 words go in the main manuscript text, NOT baked into the graphic; figure keys ARE baked into the graphic (not the legend); each figure closely cropped to minimize white space; max 10 MB per figure file; accepted formats EPS, PDF, Microsoft Word (single page), PowerPoint (single page), TIFF, JPEG, PNG, BMP, CDX (ChemDraw, for molecular structures); final PDF sizing 85 mm half-page width / 170 mm full-page width / max 225 mm combined figure+legend height / ~300 dpi at final size; all lines >=0.25 pt at standard widths; all fonts embedded; vector figures preferably PDF (more compact than EPS); TIFF saved with LZW (lossless) compression; JPEG saved at maximum quality; author responsible for permission/copyright clearance on any previously published figure, indicated in the legend with the original source in the reference list."
tables:
  style_notes: "VERIFIED (Submission guidelines > Prepare your manuscript > Preparing tables): tables numbered and cited sequentially with Arabic numerals (Table 1, Table 2...); tables under one A4/Letter page placed inline at the appropriate location; tables over one page placed at the end of the text file with an in-text placement cue; larger datasets or tables too wide for A4/Letter landscape uploaded as additional files (.xls or .csv); table titles <=15 words placed ABOVE the table, legends <=300 words placed BELOW the table; tables built with the word processor's native 'Table object' function, never embedded as an image or spreadsheet screenshot; no color or shading permitted -- distinguish parts of a table with superscript, numbering, lettering, symbols, or bold text, explained in the legend; commas must not be used to indicate numerical values."
