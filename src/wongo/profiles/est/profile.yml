# ES&T (ACS) — machine-readable profile. ONLY verified values; nulls await the
# TO VERIFY queue in SKILL.md. Contract: quarto-manuscript-sci/references/journal-profile-contract.md
journal: "Environmental Science & Technology"
slug: est
publisher: American Chemical Society
submission_portal: https://acsparagonplus.acs.org/  # via ACS Publishing Center
manuscript_types:
  - {type: research-article, word_limit: 7000, counting_rule: "Word count spans the Abstract through the end of main text (abstract + body text + titles/footnotes/captions of graphics); references and all front/back matter (title, authors, affiliations, TOC graphic, figures, tables, reference list, SI file-list, acknowledgments, notes) are excluded — figures/tables carry no separate per-graphic word-count equivalent", abstract_rule: "150-200 words, one paragraph: purpose, methods/procedures, significant new results, implications; no reference numbers"}
  - {type: policy-analysis,  word_limit: 7000, counting_rule: "same general ES&T word-count rule as research-article", abstract_rule: "same as research-article (150-200 words)"}
  - {type: feature,          word_limit: 5000, counting_rule: "same general ES&T word-count rule as research-article", abstract_rule: "shorter 3-5 sentence abstract, written for a scientifically literate general audience"}
  - {type: critical-review,  word_limit: 10000, counting_rule: "same general ES&T word-count rule as research-article", abstract_rule: "same as research-article (150-200 words); NOTE: current official guidelines label this type 'Review', not 'Critical Review' — naming reconciliation TODO for a future pass"}
  - {type: correspondence,   word_limit: 1000, counting_rule: "1,000 words EACH INCLUDING citations/references — official 'Correspondence/Rebuttal' limit explicitly includes references, unlike the general rule above which excludes them"}
  - {type: viewpoint,        word_limit: 1000, counting_rule: "no abstract; max 5 refs; 1 single-pane figure w/ 50-word caption OR one 350-word table", abstract_rule: "not required (Viewpoint has no abstract)"}
csl: assets/american-chemical-society.csl        # VERIFIED: fetched from official CSL styles repo 2026-07-03
reference_doc: assets/reference.docx             # generated by scripts/build_reference_docx.py — never hand-edit
section_headings: [Title and Authorship, Abstract and Keywords, Introduction, Materials and Methods, Results and Discussion, Abbreviations, Acknowledgment, References, Formulae and Equations]  # VERIFIED: official heading is "Materials and Methods", NOT "Experimental Section"
line_numbers: false         # VERIFIED: "Line numbers are not required."
spacing: null               # VERIFY (not addressed in fetched guidelines; Fast Format submission de-emphasizes formatting)
blinding: single            # VERIFIED: ACS-wide "single-anonymized review" — authors don't know reviewer identities, reviewers know author identities; no ES&T-specific double-anonymous option found in fetched official sources
toc_graphic:
  required: true            # VERIFIED (visual abstract; no duplicate of a figure)
  width_mm: 82.55           # VERIFIED: 3.25 in max width (official TOC/Abstract Graphics Guidelines PDF, 2024-02-28)
  height_mm: 44.45          # VERIFIED: 1.75 in max height (same source)
  min_dpi: 300              # VERIFIED: 300 dpi for color TIF; 1200 dpi required if black-and-white TIF (see formats note); EPS alternative has no dpi (vector)
  formats: [tif, eps]       # VERIFIED: TIF (300 dpi color / 1200 dpi B&W) or EPS in RGB document color mode with fonts outlined/embedded
  synopsis_words: null      # VERIFIED ABSENT: current official guidance (2024-02-28 PDF) states no synopsis requirement anywhere; the old 50-60-word-synopsis claim was an unconfirmed secondary source
  label: "For Table of Contents Only"   # VERIFIED: exact required label text for the manuscript-page graphic
  manuscript_placement: last-page       # VERIFIED: graphic goes on the LAST PAGE of the submitted manuscript (may ALSO be uploaded separately as "Graphics for manuscript")
si:
  separate_file: true       # VERIFIED
  page_prefix: "S"          # VERIFIED
  needs_own_toc: null       # VERIFY — not addressed in fetched Author Guidelines
  needs_cover_sheet: true   # VERIFIED (authors, title, page/figure/table counts)
  availability_paragraph: before-acknowledgments  # VERIFIED 2026-08-24 against the live guidelines PDF ('Last updated: July 30, 2026'): the SI description 'should appear before the Acknowledgement and Reference sections' — REVERSED from the pre-2026-07-30 'after' guidance
  forbidden_for_types: [letter-to-editor, feature, viewpoint, correspondence]  # VERIFIED
  pdf_only: false           # VERIFIED: SI need not be PDF-only; official example descriptions list both "(PDF)" and "(DOC)" as acceptable SI file-type labels
figures:
  placement: inline         # VERIFIED: "Figures, charts, tables, schemes, and equations should be embedded in the text at the point of relevance."
  color_policy: "Color reproduction is provided at no additional cost to authors; figures intended for black-and-white/grayscale reproduction must not be submitted in color; avoid relying on color alone to convey information; must meet WCAG contrast minimums (4.5:1 text, 3:1 non-text). RGB vs. CMYK color space not specified in fetched guidance."  # VERIFIED (partial — color-space encoding still open)
tables:
  style_notes: "Each table needs a brief one-phrase/sentence title, understandable without reference to the text; put details/definitions in footnotes, not the title; avoid merging/splitting cells. NOT stated in fetched guidance: horizontal-rules-only borders, caption-above placement, or superscript-letter (vs numeral) footnote markers."  # VERIFIED (partial — border/caption-position/footnote-marker convention still open)
revision_rule: "must not exceed word limit; if impossible, must not exceed submitted count and requires justification in revision letter"  # VERIFIED
sources:
  - https://researcher-resources.acs.org/publish/author_guidelines/pdf?coden=esthag
  - https://researcher-resources.acs.org/publish/author_guidelines?coden=esthag
  - https://researcher-resources.acs.org/publish/peer_reviews
  - https://pubs.acs.org/page/esthag/submission/authors.html
  - https://pubs.acs.org/page/esthag/submission/revisions.html
  - https://pubs.acs.org/doi/10.1021/es2012269
  - https://pubs.acs.org/paragonplus/submission/toc_abstract_graphics_guidelines.pdf  # "Guidelines for Table of Contents/Abstract Graphics", dated 2024-02-28; fetched by user 2026-07-04
  - archive/toc_abstract_graphics_guidelines.pdf  # local copy of the above, fetched 2026-07-04
reviewers_min: 4            # VERIFIED 2026-08-24: 'must also submit the names and addresses (including email addresses) of at least 4 potential reviewers' (ES&T Peer Review section, live PDF 2026-07-30)
keywords_count: [5, 8]      # VERIFIED 2026-08-24: 'must be accompanied by 5-8 keywords', 'published immediately before the text, following the abstract' (live PDF 2026-07-30)
orcid_hard_at: revision     # VERIFIED 2026-08-24: validated ORCID required BEFORE COMPLETING REVISION submission; strongly encouraged (not blocking) at original submission (live PDF 2026-07-30)
verified_date: 2026-08-24
