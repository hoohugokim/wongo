project:
  type: default
  output-dir: output
engine: knitr
format:
  docx:
    number-sections: false
    # reference-doc and csl are injected at render time by wongo
    # from the journal profile — do not hard-code them here.
bibliography: refs.bib
execute:
  freeze: auto
# Visual editors (RStudio, Positron, VS Code) keep one sentence per line,
# which the Word round-trip depends on. Render with wongo, not the editor's
# Render button: that skips the journal styling and the submission gates.
editor:
  markdown:
    wrap: sentence
