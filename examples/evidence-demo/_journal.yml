journal: demo
ms_type: article
style: default
demonstration: true
dependencies:
  - data/measurements.csv
audits:
  - id: rendered-response
    script: scripts/audit_response.py
    inputs: [data/measurements.csv, index.qmd]
    required: true
visual_review_required: true
manual_gates:
