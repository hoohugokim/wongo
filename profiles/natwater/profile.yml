# Nature Water (Springer Nature / Nature Portfolio) — machine-readable
# profile. ONLY verified values; nulls await the TO VERIFY queue in SKILL.md.
# Contract: quarto-manuscript-sci/references/journal-profile-contract.md
journal: "Nature Water"
slug: natwater
publisher: "Springer Nature (Nature Portfolio) — Nature-brand journal, no external editorial board"
submission_portal: https://mts-natwater.nature.com/cgi-bin/main.plex  # "Submit manuscript" link, nature.com/natwater navigation + Submission guidelines page
manuscript_types:
  - {type: article, word_limit: 3000, counting_rule: "up to 3,000 words, excluding abstract, Methods, references and figure legends; the journal's ONLY original-research format, 'may range from what are typically considered to be short communications, through to more in-depth studies'; structure Introduction (no heading) / Main text / Discussion-Conclusions (no subheadings) / Methods; up to 7 display items; references guideline up to 50 (not strictly enforced)", abstract_rule: "up to 150 words, unreferenced"}
  - {type: analysis, word_limit: 4000, counting_rule: "up to 4,000 words, excluding abstract, online Methods, references and figure legends; 'a new analysis of existing data, describes new data obtained in a comparative analysis or introduces a new simulation or model that leads to novel and arresting conclusions'; systematic reviews/meta-analyses of primary literature accommodated here; same Introduction/Main text/Discussion/Methods structure as Article; up to 8 display items; references guideline up to 50. BEST-FIT TYPE for an LLM-benchmark/comparative-evaluation manuscript — see references/editorial-framing.md", abstract_rule: "100-150 words, unreferenced"}
  - {type: perspective, word_limit: 4000, counting_rule: "up to 4,000 words, excluding abstract, references, figure/table captions and boxes; 'a review of a topic from a personal viewpoint... may not contain primary research data'; up to 5 display items; references guideline up to 120, citations should be selective; footnotes not used; asterisked on Content types page -> NOT eligible for Gold OA, subscription-route only. NOTE: the 'no primary research data' rule means a benchmark paper with original evaluation results does NOT fit this type -- see references/editorial-framing.md", abstract_rule: "100-150 words (prose)/up to 150 words (Format block), unreferenced"}
  - {type: review, word_limit: 6000, counting_rule: "up to 6,000 words, excluding abstract, references, figure/table captions and boxes; 'Unpublished primary research data are not permitted in Reviews'; scope must not be dominated by a single institution/the authors' own work; usually commissioned by editors -- Content types page says to send a presubmission enquiry, but the journal's own Presubmission enquiries page states none are accepted (unresolved contradiction between two official pages, see SKILL.md TO VERIFY); up to 8 display items; references guideline up to 120; asterisked -> subscription-route only", abstract_rule: "up to 150 words, unreferenced"}
  - {type: comment, word_limit: 2000, counting_rule: "up to 2,000 words; no fixed structure; 'does not normally contain primary research data' though sociological/bibliometric data allowed; peer review at editors' discretion; references used sparingly, up to 15, article titles omitted; asterisked -> subscription-route only", abstract_rule: null}
  - {type: correspondence, word_limit: 800, counting_rule: "between 300-800 words (both bounds live); 1 display item; references up to 10, article titles omitted; peer-reviewed at editors' discretion; NOT for technical comments on Nature Water papers (use Matters Arising instead); asterisked -> subscription-route only", abstract_rule: null}
  - {type: matters-arising, word_limit: 1200, counting_rule: "main text 'ideally not exceed 1,200 words'; opens with a brief non-specialist summary paragraph used as the submission abstract (no numeric cap beyond 'brief'); ideally 1-2 small figures/tables (complex ones as Extended Data, <=3 items); references guideline up to 15, reference style as for Articles; competing-interests and author-contributions statements mandatory; life-sciences contributions with new data need a reporting summary AND editorial policy checklist before peer review; must attempt contact with original authors first (2-week wait if no response); not considered for papers published in other journals", abstract_rule: "brief, non-specialist summary paragraph (no numeric word cap stated)"}
csl: assets/nature.csl                          # VERIFIED: fetched from official CSL styles repo 2026-07-04; Nature Water's own AIP-and-formatting page (Sec. 5, References) is a first-party (non-deferred) reference-style spec matching this CSL's numeric, italicized-journal-name, footnotes-unsupported style; the CSL's own documentation link points to nature.com/nature/for-authors/formatting-guide, the exact Nature-brand house style this journal belongs to.
reference_doc: assets/reference.docx             # generated by scripts/build_reference_docx.py — never hand-edit
section_headings: [Title, Abstract, Introduction, Main text, Discussion/Conclusions, Methods, Data availability, Code availability, Acknowledgements, Author contributions, Competing interests, References, Figure legends, Extended Data]  # VERIFIED: Article/Analysis structure (Content types page) + AIP-and-formatting's own reference-numbering order (Main Text/Methods/Data Availability Section/Tables/Figure Legends/Box/Extended Data Figures), which fixes Data availability and Code availability ahead of Tables/Figure legends; Extended Data is a Nature-brand-specific optional online-only section (max 10 items) not present in the npj Clean Water profile
line_numbers: null          # TO VERIFY: not addressed in "Formatting your initial submission" or the full "AIP and formatting" page (checked all 15 numbered sections)
spacing: null               # TO VERIFY: not addressed in either fetched formatting page
blinding: optional          # VERIFIED: single-anonymized by default ("Reviewers are not identified to the authors, except at the request of the reviewer," Editorial process page) WITH a confirmed double-anonymized OPT-IN option specific to this journal (submission-guidelines/dapr: "Nature Water offers double-anonymized peer review; authors who choose this option will remain anonymous to the reviewers throughout the peer review process" — tick-box at submission; authors responsible for anonymizing their own manuscript, not checked by the editor)
toc_graphic:                 # VERIFIED ABSENT, recorded explicitly (not left null) per this profile's authoring brief
  required: false            # VERIFIED: no TOC graphic / graphical abstract / visual abstract of any kind is mentioned in Aims & Scope, Content types, Preparing your material, Initial formatting, or the full AIP-and-formatting page (all 15 sections checked); "Cover artwork" (Sec. 15) is an optional editor-selected ISSUE-COVER contest, a distinct concept, not a per-article submission requirement
  width_mm: null
  height_mm: null
  min_dpi: null
  formats: []
  synopsis_words: null
  label: null
  manuscript_placement: null
si:
  separate_file: true        # VERIFIED: primary SI submitted as "a single combined PDF" ("supplementary text, figures, simple tables or data, and associated legends")
  page_prefix: null          # TO VERIFY: no S1/S2-style pagination convention stated in AIP-and-formatting Sec. 10 (Supplementary information)
  needs_own_toc: null        # TO VERIFY: not addressed in Sec. 10
  needs_cover_sheet: false   # VERIFIED ABSENT: no SI cover sheet is mentioned anywhere in Sec. 10 or the Preparing-your-material page
  pdf_only: false            # VERIFIED (partial): primary SI is a single combined PDF, but complex tables/data larger than an A4 PDF page are explicitly accepted separately as Excel workbooks or .csv files named "Supplementary Tables"/"Supplementary Data"
  supplementary_methods_allowed: true  # VERIFIED (differs from npj Clean Water): AIP-and-formatting Sec. 10 explicitly allows a "Supplementary Note" for additional methodological information (algorithm description, step-by-step protocol, compound synthesis/characterization) when the main-text Methods needs supplementing — this is the OPPOSITE of npj Clean Water's "no Supplementary Methods" rule; Nature-brand-specific extension key beyond the base contract schema
  extended_data_max_items: 10  # VERIFIED (Nature-brand-specific extension key): max 10 Extended Data display items, online-only, must be cited as discrete items in the main text, sized to fit one PDF page each, not copy-edited by the journal
figures:
  placement: inline          # VERIFIED: figures cited in sequence in the main text as "Fig. 1", "Fig. 2"
  color_policy: "Minimum 300 dpi, maximum width 180 mm; 5-7 pt sans-serif font for figure text labelling, Symbol font for Greek characters; scale bars not magnification factors; error bars where appropriate; do not flatten labelling/scale/error bars onto images. Legends: brief title + per-panel description cited in sequence; verbal cues (e.g. 'open red triangles') not visual symbols; must state centre-value definition (median/mean), error-bar definition, sample size (n), statistical test used, and P values; legend length rides on the manuscript type's own word limit (no separate fixed figure-legend cap, unlike npj Clean Water's flat 350-word/figure rule). Colour charges 'print journals only' do NOT apply -- Nature Water is confirmed exclusively online (Journal information page), so this is a resolved N/A, not a live cost."   # VERIFIED
tables:
  style_notes: "Place tables at the end of the text document (Word or TeX/LaTeX); complex tables submitted as a separate Excel file; tables with statistical analysis must describe error-analysis standards and ranges in the table legend; tables featuring chemical structures include native ChemDraw .cdx files supplied separately. No stated rule on border style, caption position (above/below), or footnote-marker convention -- NOT stated in fetched guidance (AIP-and-formatting Sec. 2, checked in full)."   # VERIFIED (partial)
