# Water Research (Elsevier, in association with IWA) — machine-readable
# profile. ONLY verified values; nulls await the TO VERIFY queue in SKILL.md.
# Contract: quarto-manuscript-sci/references/journal-profile-contract.md
journal: "Water Research"
slug: wr
publisher: "Elsevier, in association with the International Water Association (IWA)"
submission_portal: https://submit.elsevier.com/WR  # VERIFIED: stated directly in the official Guide for Authors ("Please follow this link to submit your paper")
manuscript_types:
  - {type: research-paper, word_limit: 8000, counting_rule: "Total length of the manuscript INCLUDING references must not exceed 8000 words (word count is NOT reference-exclusive, unlike most Elsevier/ACS journals). Case studies not accepted unless of wide industry impact. Figures/tables should be added only if truly useful for the presentation.", abstract_rule: "concise, factual abstract not exceeding 250 words; states purpose, principal results, major conclusions; avoid references unless essential (cite author+year if used); avoid non-standard abbreviations"}
  - {type: review-paper, word_limit: 12000, counting_rule: "'Typical reviews are less than 12,000 words including references' — phrased as typical/guidance, not an absolute hard cap like the Research Paper limit. Must be a CRITICAL review with a novel perspective, not a simple summary of the literature. Cover letter must state the authors' expertise in the topic, list their own related publications, and explain how the review provides new insight beyond existing reviews on the same topic.", abstract_rule: "same 250-word general abstract rule as research-paper (no override stated for reviews)"}
  - {type: making-waves, word_limit: 3000, counting_rule: "'Submissions are usually limited to 3000 words' accompanied by no more than TWO illustrations (figures or tables) in total. Title must begin with 'Making Waves: '. Use topical section headings INSTEAD of the customary Materials and Methods / Results and Discussion breakdown. Use bullet points in Conclusions. Supplementary Information is NOT admissible for this type.", abstract_rule: "a short abstract is required (exact word count not stated — distinct from, and shorter than, the general 250-word rule)"}
  - {type: comment-or-reply, word_limit: 1200, counting_rule: "Comments on already-published papers, and the original authors' Replies, must each not exceed 1200 words. Must be submitted within 4 months of the original article's publication. Submitted under the article type 'Discussion' with a mandated title format: 'Comment on \"TITLE [Water Research VOLUME YEAR PAGE-RANGE]\"' (or 'Reply for Comment on ...'). Accepted or rejected without corrections; multi-part papers not considered.", abstract_rule: "not addressed — no abstract requirement stated for this type"}
csl: assets/elsevier-harvard.csl   # VERIFIED: official CSL styles repo's dependent/water-research.csl (ISSN 0043-1354 match) declares independent-parent "elsevier-harvard", citation-format "author-date" — fetched and confirmed 2026-07-04. NOTE: the live Guide for Authors page itself contains an internal contradiction (see SKILL.md) — a generic numbered/bracket-citation example alongside an author-date Harvard example that specifically cites "Water Research 25 (9), 1137-1143" as its worked example. The CSL repo's authoritative ISSN-matched mapping plus that self-referential Harvard example both point to elsevier-harvard; the numbered example is treated as unpruned generic GfA boilerplate.
reference_doc: assets/reference.docx             # generated by scripts/build_reference_docx.py — never hand-edit
section_headings: [Title, Abstract, Keywords, Highlights, Graphical Abstract, Introduction, Methods, Results, Discussion, Conclusion, Acknowledgements, References]  # VERIFIED core structure from the official Guide for Authors "Article structure" + front-matter sections. Acknowledgements confirmed to sit "directly before the reference list." Placement of CRediT/Author Contributions, Declaration of Competing Interest, and the Declaration of Generative AI Use relative to Acknowledgements is NOT pinned down precisely by the GfA text (see SKILL.md) — do not assume a specific order for those three beyond "before References" for the AI declaration.
line_numbers: false   # VERIFIED, but semantically distinct from a plain "not required": the GfA says "Please do not include line numbering in the manuscript file, as it will be added automatically." I.e. Elsevier's own submission-processing system adds line numbers to the peer-review PDF itself — authors/render.py must NOT bake line numbers into the submitted docx. `false` here is the correct render.py directive (do not insert line numbers), not a claim that the final PDF has none.
spacing: null          # TO VERIFY: not addressed anywhere in the fetched "Writing and formatting" section (only column layout — single-column Word / double-column LaTeX-only — is specified, which is a different axis than line spacing)
blinding: single       # VERIFIED: "This journal follows a single anonymized review process." No double-anonymized option is mentioned anywhere on the Guide for Authors page (contrast with Elsevier's general double-anonymized policy, which is opt-in per journal and requires checking that journal's own GfA — checked here, and WR's GfA does not offer it)
toc_graphic:
  required: false      # VERIFIED: "You are ENCOURAGED to provide a graphical abstract at submission" (contrasted directly against Highlights' "You are REQUIRED to provide article highlights" in the same GfA) — graphical abstract is optional for Water Research
  width_mm: 130         # VERIFIED: GfA states "531 x 1328 pixels (h x w)... readable at a size of 5 x 13 cm" -> 13 cm = 130 mm (width)
  height_mm: 50          # VERIFIED: same source -> 5 cm = 50 mm (height)
  min_dpi: null          # TO VERIFY: the GfA gives a physical readable size (5x13cm) and pixel count but does not itself state a "dpi" figure for the graphical abstract (contrast with the separate, explicit 300/1000/500 dpi tiers stated for regular manuscript figures)
  formats: [tiff, eps, pdf, ms-office]   # VERIFIED: "Preferred file types for graphical abstracts are TIFF, EPS, PDF or MS Office files" (ms-office = editable Word/PowerPoint files, not a single extension)
  synopsis_words: null   # VERIFIED ABSENT: no separate synopsis/blurb word count is mentioned for the graphical abstract beyond the abstract itself
  label: null            # TO VERIFY: no required on-graphic label text (e.g. ACS's "For Table of Contents Only") was found
  manuscript_placement: null   # NOTE: neither "last-page" nor "after-abstract" applies cleanly — the graphical abstract is uploaded as a SEPARATE FILE in the online submission system (like Highlights) and is not described as being inserted into the manuscript document body at all; render.py's insert_toc_art() should NOT run for this profile until/unless that changes
si:
  separate_file: true     # VERIFIED: supplementary material is submitted as separate file(s) alongside the manuscript
  page_prefix: null        # TO VERIFY: not addressed in fetched guidance
  needs_own_toc: null       # TO VERIFY: not addressed in fetched guidance
  needs_cover_sheet: null    # TO VERIFY: not addressed in fetched guidance (no ACS-style cover-sheet analog found)
  pdf_only: false            # VERIFIED ABSENT: no file-format restriction stated ("applications, images and sound clips" all explicitly allowed); files "will not be checked, formatted or typeset by the production team" and appear online exactly as received
  post_submission_edit_window: "revision stage only"   # VERIFIED (custom key): "After submission supplementary files can only be added or replaced in the revision stage of the editorial process."
  forbidden_for_types: [making-waves]   # VERIFIED: "Supplementary Information is not admissible" for the Making Waves article type
figures:
  placement: inline        # VERIFIED (partial): "Text graphics may be embedded in the text at the appropriate position"; separately, all figures/images/artwork "must be supplied as separate files along with the manuscript" for production regardless of in-text embedding
  color_policy: "Resolution tiers by artwork type: color/grayscale photographs (halftones) >=300 dpi (single-column >=1063 px, full-page >=2244 px); bitmapped line drawings >=1000 dpi (single-column >=3543 px, full-page >=7480 px); combination bitmapped line/halftone >=500 dpi (single-column >=1772 px, full-page >=3740 px). Vector drawings saved as EPS or PDF with fonts embedded or text converted to graphics/outlines. Color reproduction online is provided (accepted color figures 'will appear in color online') but no explicit free-of-charge-in-print statement, RGB-vs-CMYK color space, or sans-serif figure-lettering rule was found in fetched guidance."  # VERIFIED (partial)
tables:
  style_notes: "Submit tables as editable text, never as images. Place next to the relevant text or on separate page(s) at the end. Number consecutively by order of appearance. Provide a caption with each table; place any table notes BELOW the table body (not in the caption/title). Avoid vertical rules and shading within table cells. Use tables sparingly — do not duplicate data already presented elsewhere in the article."  # VERIFIED
revision_rule: null   # TO VERIFY: no explicit revision word-count-overrun rule (cf. ES&T's) was found in the fetched Water Research Guide for Authors
# --- Custom keys beyond the base journal-profile-contract schema (Elsevier/WR-specific) ---
highlights:            # CUSTOM KEY: Elsevier's "Highlights" requirement has no dedicated slot in the base contract schema
  required: true        # VERIFIED: "You are required to provide article highlights at submission." (general rule; Making Waves overrides to "up to three")
  count_general: [3, 5]  # VERIFIED: "3 to 5 bullet points" for the general/default case (Research Paper, Review Paper)
  count_making_waves: 3   # VERIFIED: Making Waves gets "up to three highlights" instead of 3-5 — a documented per-type override
  max_chars_per_bullet: 85  # VERIFIED: "each a maximum of 85 characters, including spaces"
  submission: "separate editable file (not inline in the manuscript); filename must include the word 'highlights'"  # VERIFIED
credit_authorship_statement:   # CUSTOM KEY
  required: true         # VERIFIED: "Corresponding authors are required to acknowledge co-author contributions using CRediT ... roles"
  roles: [Conceptualization, "Data curation", "Formal analysis", "Funding acquisition", Investigation, Methodology, "Project administration", Resources, Software, Supervision, Validation, Visualization, "Writing – original draft", "Writing – review and editing"]  # VERIFIED: exact 14-role list as given on the Guide for Authors page
declaration_of_competing_interest:  # CUSTOM KEY
  required: true          # VERIFIED: "The declarations tool should always be completed." Authors with none select "I have nothing to declare" — a declaration is mandatory even when empty
  mechanism: "Completed via Elsevier's declarations.elsevier.com tool; the resulting Word (.doc/.docx) document is uploaded as a separate file at the 'attach/upload files' submission step. Author signatures are not required."  # VERIFIED
data_availability:      # CUSTOM KEY
  policy_tier: "Option A"   # VERIFIED: "For this journal, Option A instructions ... apply" (Elsevier's tiered research-data policy)
  required: false          # VERIFIED: Option A = ENCOURAGED, not mandatory — "you are encouraged to: deposit your research data in a relevant data repository; cite this dataset in your article"
generative_ai_declaration:  # CUSTOM KEY
  required_if_used: true    # VERIFIED: "Authors must declare the use of generative AI tools in the manuscript preparation process upon submission" whenever such tools were used; not required if nothing to disclose
  placement: "new section titled 'Declaration of generative AI and AI-assisted technologies in the manuscript preparation process', placed before the References list, added at first submission"  # VERIFIED
