# Microbiome (BMC, Springer Nature) — machine-readable profile.
# ONLY verified values; nulls await the TO VERIFY queue in SKILL.md.
# Contract: quarto-manuscript-sci/references/journal-profile-contract.md
journal: "Microbiome"
slug: microbiome
publisher: "BioMed Central (BMC), part of Springer Nature"
submission_portal: https://submission.springernature.com/new-submission/40168/3  # "Submit manuscript" link on the journal's own Submission guidelines page (link resolves through submission.nature.com but lands on this springernature.com host)
manuscript_types:
  - {type: research, word_limit: null, counting_rule: "No main-text word limit is stated anywhere in the fetched Research article guidelines (silence, not an explicit 'no limit' statement). Structure (BMC IMRaD): Title page / Abstract / Keywords / Background / Methods / Results / Discussion / Conclusions / List of abbreviations / Declarations / References / Figures, tables, additional files. Methods must state 'the aim, design and setting of the study; the characteristics of participants or description of materials; a clear description of all processes, interventions and comparisons; the type of statistical analysis used, including a power calculation if appropriate.' Microbiome-specific: studies must include sampling controls, extraction controls, and PCR-amplification negative controls, plus positive controls (mock communities or others); metadata formatted to MIxS (Minimum Information about any (x) Sequence, Genome Standards Consortium) standards; all original sequences MUST be deposited in a public repository, publicly available at time of publication.", abstract_rule: "up to 350 words, structured: Background / Results / Conclusions; minimize abbreviations; do not cite references in the abstract"}
  - {type: methodology, word_limit: null, counting_rule: "No main-text word limit stated. Same BMC IMRaD structure and Declarations block as Research article: Title page / Abstract / Keywords / Background / Methods / Results / Discussion / Conclusions / List of abbreviations / Declarations / References / Figures, tables, additional files.", abstract_rule: "up to 350 words, structured: Background / Results / Conclusions; minimize abbreviations; do not cite references in the abstract"}
  - {type: brief-report, word_limit: null, counting_rule: "'Suitable for the presentation of research that extends previously published research, including the reporting of additional controls and confirmatory results in other settings, as well as negative results, small-scale clinical studies, clinical audits and case series.' No main-text word limit stated. Same IMRaD structure as Research article.", abstract_rule: "up to 350 words, structured: Background / Results / Conclusions; minimize abbreviations; do not cite references in the abstract"}
  - {type: software, word_limit: null, counting_rule: "'Should describe a tool likely to be of broad utility that represents a significant advance over previously published software' (usually with direct comparison to existing tools). No main-text word limit stated. Same IMRaD structure as Research article.", abstract_rule: "up to 350 words, structured: Background / Results / Conclusions; minimize abbreviations; do not cite references in the abstract"}
  - {type: review, word_limit: null, counting_rule: "The journal 'does not consider unsolicited Reviews' — 'Reviews published in the journal are specially invited by the Editors of Microbiome,' and authors are expected to be 'leading experts in the field with a track record of publication in that specific field.' No main-text word limit stated. Structure: Title page / Abstract / Keywords / Main text (may include subsections) / Conclusions / List of abbreviations / Declarations / References / Figures, tables, additional files.", abstract_rule: "up to 350 words; minimize abbreviations; do not cite references in the abstract (no internal Background/Results/Conclusions structure required, unlike Research)"}
  - {type: comment, word_limit: null, counting_rule: "'Short, narrowly focused articles' that are 'usually commissioned by the journal' and 'are not mini-reviews.' No main-text word limit stated. Structure: Title page / Abstract / Keywords / Background / Main text / Conclusions / List of abbreviations / Declarations / References / Figures, tables, additional files.", abstract_rule: "up to 350 words, structured: background, main body of the abstract, short conclusion"}
  - {type: correspondence, word_limit: null, counting_rule: "'May be edited for clarity or length and may be subject to peer review at the editors' discretion.' No word limit or internal structure beyond: Title page / Abstract / Keywords / Main text / List of abbreviations / Declarations / References / Figures, tables, additional files.", abstract_rule: "brief summary of the aim, findings, or purpose of the article; minimize abbreviations; do not cite references in the abstract (no numeric word cap stated)"}
  - {type: meeting-report, word_limit: null, counting_rule: "'Usually commissioned'; should 'focus on new research discoveries and the application of this knowledge' rather than comprehensive coverage of all presentations at a meeting. No main-text word limit stated. Structure: Title page / Abstract / Keywords / Main text (may contain subsections) / List of abbreviations / Declarations / References / Figures, tables, supplementary files.", abstract_rule: "up to 250 words; minimize abbreviations; do not cite references in the abstract"}
csl: assets/biomed-central.csl                  # VERIFIED: fetched from the official CSL styles repo 2026-07-04; documentation link in the CSL's own <info> block points to a BMC-family "research-article" submission-guidelines page (bmcbioinformatics.biomedcentral.com/.../research-article), the same numbered-square-bracket house style Microbiome's own Research article page describes ("references ... numbered consecutively, in square brackets, in the order in which they are cited in the text")
reference_doc: assets/reference.docx             # generated by scripts/build_reference_docx.py — never hand-edit
section_headings: [Title, Abstract, Keywords, Background, Methods, Results, Discussion, Conclusions, "List of abbreviations", Declarations, References, "Figures, tables, additional files"]  # VERIFIED: exact order from the official Research article page (the journal's flagship IMRaD type); Declarations itself expands into 7 mandatory + 1 optional subsection (see declarations_subsections below); Review/Comment/Correspondence/Meeting Report drop Background/Methods/Results/Discussion in favor of a plain "Main text" heading — see manuscript_types[].counting_rule for each type's actual structure
line_numbers: true          # VERIFIED: official Submission guidelines page states manuscripts require "Double-line spacing, line and page numbering ... no page breaks"
spacing: double              # VERIFIED: same statement as above
blinding: single             # VERIFIED, verbatim from the journal's own Submission guidelines page: "Single-anonymous peer review system, where the reviewers are aware of the names and affiliations of the authors, but the reviewer reports provided to authors are anonymous." (BMC-wide, the publisher also offers open/transparent models on other titles, but Microbiome itself states single-anonymous, not an author-selectable option)
toc_graphic:                 # VERIFIED ABSENT, recorded explicitly (not left null) per this profile's authoring brief
  required: false            # VERIFIED: no "graphical abstract," "visual abstract," or "TOC image" of any kind is mentioned in Aims and scope, Submission guidelines (full page), Research article, Methodology, Review, Brief report, Software, Comment, Correspondence, or Meeting Report guideline pages — all fetched and read in full 2026-07-04. Microbiome has no such concept.
  width_mm: null
  height_mm: null
  min_dpi: null
  formats: []
  synopsis_words: null
  label: null
  manuscript_placement: null
si:
  separate_file: true        # VERIFIED: BMC "Additional files" are uploaded as distinct files separate from the main manuscript document (NOT embedded in it)
  page_prefix: null          # TO VERIFY: no S1/S2-style SI page-numbering convention was found; the only naming convention found applies to the FILES themselves ("Additional file 1", "Additional file 2", ...), not to page numbers within a file
  needs_own_toc: null        # TO VERIFY: not addressed in any fetched page
  needs_cover_sheet: false   # VERIFIED ABSENT: no SI/Additional-file cover sheet is mentioned anywhere in the fetched Submission guidelines content
  pdf_only: false            # VERIFIED: multiple formats explicitly accepted for additional files (e.g. Excel .xls, .csv, PDF, .txt, .pptx) — NOT a single-merged-PDF convention (differs from the Nature-family npj Clean Water / Nature Water profiles)
  file_naming: "Additional file 1, Additional file 2, ... (sequential, cited in the main text); each additional file uploaded and published as its own separate file, not merged into one combined document"   # VERIFIED (BMC-specific extension key beyond the base contract schema)
  max_file_size_mb: 20       # VERIFIED (extension key): "The maximum file size for additional files is 20 MB each"
figures:
  placement: end              # VERIFIED (inferred from the official section-order list itself): the Research/Methodology/Software/Brief-report structure places "Figures, tables, additional files" as the LAST section, after References, in the single submitted manuscript file
  color_policy: "Individual figure files must not exceed 10 MB; image resolution ~300 dpi at final size; width 85 mm for a half-page figure or 170 mm for a full-page figure, maximum height 225 mm; all lines wider than 0.25 pt; figures numbered in the order first mentioned in text and uploaded in that order; figure titles (<=15 words) and legends (<=300 words) given in the main manuscript file, NOT in the graphic file itself; figure keys incorporated into the graphic, not the legend; multi-panel figures (a, b, c, d...) submitted as a single composite file; each figure closely cropped to minimize white space; correct orientation required."   # VERIFIED
tables:
  style_notes: "Numbered and cited in text in sequence using Arabic numerals (Table 1, Table 2, ...); table title (<=15 words) placed above the table, legend (<=300 words) placed below; tables must be built with Word's native 'Table object' function, NOT embedded as an image or spreadsheet screenshot; color and shading may not be used; commas must not be used to indicate numerical values (superscript/numbering/lettering/symbols/bold text may highlight parts of a table, explained in the legend); tables shorter than one A4/Letter page may sit inline in the manuscript at the appropriate location; larger datasets go out as additional files."   # VERIFIED
