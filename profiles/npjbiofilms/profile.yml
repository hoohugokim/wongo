journal: "npj Biofilms and Microbiomes"
slug: npjbiofilms
publisher: "Springer Nature (Nature Portfolio), in partnership with Nanyang Technological University Singapore and the Singapore Centre for Environmental Life Sciences Engineering (SCELSE)"
submission_portal: https://submission.springernature.com/new-submission/41522/3  # "Submit manuscript" link, nature.com/npjbiofilms homepage
manuscript_types:
  - {type: article, word_limit: null, counting_rule: "npj Series journals are online-only and fully Open Access and impose NO strict word or page limit for Articles — 'Articles should report substantial original primary research'; systematic reviews, scoping reviews, and meta-analyses must be submitted as Articles, not Reviews. Structure per the journal's own formatting table: Title page / Abstract (<=150 words, no subheadings) / Introduction / Results / Discussion / Methods / Data availability / Code availability / Acknowledgments / Author contributions / Competing Interests / References (<=60, not strictly enforced) / Figure legends (<=350 words per figure, placed after references).", abstract_rule: "up to 150 words, no subheadings"}
  - {type: brief-communication, word_limit: 1500, counting_rule: "main text no more than 1,000-1,500 words, not including the abstract, methods, references, and figure legends", abstract_rule: "up to 70 words, no subheadings"}
  - {type: comment, word_limit: 2000, counting_rule: "main text typically 1,000-2,000 words", abstract_rule: "up to 70 words, no subheadings"}
  - {type: editorial, word_limit: null, counting_rule: "no stated main-text word limit; 'typically written by the senior editorial team of the journal, under the direction of the Editor-in-Chief. Unsolicited Editorials will not be considered.'; references limited to 60, though not strictly enforced", abstract_rule: "up to 70 words, no subheadings"}
  - {type: matters-arising, word_limit: 1200, counting_rule: "main text ideally not exceeding 1,200 words; opening paragraph must summarize the message for non-specialist readers and serves as the abstract; should ideally have been sent to the authors of the paper under discussion before submission (2-week wait if no response); only considered for papers published in this journal itself", abstract_rule: "opening paragraph functions as the abstract (no separate numeric cap beyond the 70-word content-types figure)"}
  - {type: meeting-report, word_limit: 3000, counting_rule: "up to 3,000 words; typically commissioned by the Editors; 'should include a substantive discussion and clear outputs from a scientific meeting or workshop that will be of broad interest'; peer reviewed; references limited to 70, though not strictly enforced. Journal-specific type NOT present in the npj Clean Water sibling profile.", abstract_rule: "up to 70 words, no subheadings"}
  - {type: perspective, word_limit: 3000, counting_rule: "main text should not normally exceed 3,000 words; references limited to 70, though not strictly enforced", abstract_rule: "up to 70 words, no subheadings"}
  - {type: review, word_limit: 4000, counting_rule: "main text typically 3,000-4,000 words; 'narratively summarize recent advances in the scientific literature within a given research field'; scope must be broad enough not to be dominated by the work of a single laboratory, particularly not the authors' own work; references limited to 60, though not strictly enforced", abstract_rule: "up to 70 words, no subheadings"}
csl: assets/nature.csl                          # VERIFIED: fetched from official CSL styles repo 2026-07-04; npj Biofilms and Microbiomes' own Submission guidelines state "The npj Series journals use standard Nature referencing style." (npj-Series-wide rule, re-confirmed on THIS journal's own page)
reference_doc: assets/reference.docx             # generated by scripts/build_reference_docx.py — never hand-edit
section_headings: [Title page, Abstract, Introduction, Results, Discussion, Methods, Data availability, Code availability, Acknowledgments, Author contributions, Competing Interests, References, Figure legends]  # VERIFIED: exact order from the official Article formatting table (Content types page); Figure legends confirmed as its own final section, placed after References, limited to 350 words/figure
line_numbers: null          # TO VERIFY: Submission guidelines page's own "NOT MENTIONED" summary explicitly names "Line numbers" as absent from the fetched guidance (formatting requirements only apply at acceptance; no line-number statement found even there)
spacing: null               # TO VERIFY: same page's "NOT MENTIONED" summary explicitly names "Line spacing" as absent
blinding: single            # VERIFIED: "The npj Series operate a 'single-anonymized peer review process.' In line with policy, referees are not identified to the authors, except at the request of the referee." (npj Biofilms and Microbiomes Editorial process page). A double-anonymized OPTION is documented Nature-Portfolio-wide ("Some Nature-branded journals and Communications journals offer a double-anonymized peer review option") but npj Biofilms and Microbiomes is confirmed NOT among the journals listed as offering it (checked the full transparent-peer-review list and the 2015 double-anonymized rollout list on the Nature-Portfolio-wide Peer Review policy page that this journal's own Editorial Policies page links to) — stays single here; see TO VERIFY.
toc_graphic:                 # VERIFIED ABSENT, recorded explicitly (not left null) per this profile's authoring brief
  required: false            # VERIFIED: no TOC graphic / graphical abstract / visual abstract of any kind is mentioned in Aims & Scope, Content types, or Submission guidelines — the latter's own page explicitly lists "Graphical abstract", "Table of contents", and "Visual summary" among items NOT specified anywhere in the fetched guidance. Consistent with the npj Series having no such concept (same finding as npj Clean Water and Nature Water, re-confirmed here on npj Biofilms and Microbiomes' own pages).
  width_mm: null
  height_mm: null
  min_dpi: null
  formats: []
  synopsis_words: null
  label: null
  manuscript_placement: null
si:
  separate_file: true        # VERIFIED: "All supplementary information cited in the manuscript should be provided in a separate, single merged PDF."
  page_prefix: null          # TO VERIFY: no S1/S2-style pagination convention stated in any fetched page
  needs_own_toc: null        # TO VERIFY: not addressed in any fetched page
  needs_cover_sheet: false   # VERIFIED ABSENT: no SI cover sheet (authors/title/page-figure-table counts) is mentioned anywhere in the fetched Submission guidelines Supplementary Information section
  pdf_only: false            # VERIFIED (partial): primary SI is a single merged PDF, but oversized supplementary tables too large for a PDF page are explicitly provided SEPARATELY and labeled "Supplementary Data XX" (not "Supplementary Table"), with title/legend still in the main SI PDF
  supplementary_methods_allowed: false  # VERIFIED: "The journal does not permit Supplementary Methods, all Methods should be reported in the main manuscript file." (npj-specific extension key beyond the base contract schema; same rule as npj Clean Water, re-confirmed here on npj Biofilms and Microbiomes' own Submission guidelines page)
figures:
  placement: inline          # VERIFIED: "Figures should be cited in the text in the order in which they appear"; incorporated into the main article file at initial submission, or grouped/deposited with a private repository link if the combined file is impractical
  color_policy: "Initial submission ('for peer review'): incorporate into the main article file at sufficient quality to be clearly legible; if not possible, submit separate high-resolution files or a repository private-sharing link. Final publication ('for publication'): each complete multi-panel figure as ONE image file (not individual panels), RGB color, >=300 dpi; same sans-serif typeface (Arial or Helvetica) for all figure lettering and symbol font for Greek letters, optimum 8pt at final print size; thinnest lines >=1pt; preferred vector formats .ai/.eps/.pdf/.ps/.svg (editable layered .psd/.tif also accepted; bitmap .psd/.tif/.png/.jpg; .ppt if fully editable; ChemDraw .cdx for chemical structures); avoid red/green contrast, avoid rainbow pseudo-color, recolor for colorblind accessibility (e.g. green/magenta, turquoise/red, yellow/blue); multi-panel figures on one page labeled lower-case bold a), b), c); scale bars preferred over magnification factors; verbal cues in legends (e.g. 'open red triangles') rather than visual symbols; avoid excessive boxing, unnecessary color, 3D decorative effects, truncated axes. Figure legends: brief title + per-panel description, <=350 words per figure, define all error bars/abbreviations/symbols in words, placed as the final section of the main manuscript file after References. Video files accepted as figures (multiple formats incl. mp4/mov/avi), <=150MB/file, <=1GB combined, first frame used as the static PDF image."   # VERIFIED
tables:
  style_notes: "Submit tables at the end of the text document (Word or TeX/LaTeX). Tables with statistical analysis must describe error-analysis standards and ranges in a table legend. No stated rule on border style, caption position (above/below), or footnote-marker convention (numeral vs. letter) — NOT stated in fetched guidance."   # VERIFIED (partial)
