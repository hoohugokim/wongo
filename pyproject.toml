[project]
name = "wongo"
version = "0.1.0.dev0"
description = "wongo (원고, 'manuscript') — Quarto-to-journal manuscript pipeline: verified journal profiles, submission-grade DOCX rendering, and Word-coauthor round-tripping"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Hoo Hugo Kim", email = "hookim@kist.re.kr" }]
keywords = ["quarto", "manuscript", "docx", "journal", "publishing", "reproducible-research"]
dependencies = [
  "PyYAML>=6",
  "python-docx>=1.1",
]

[project.scripts]
wongo = "wongo.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wongo"]
