[project]
name = "wongo"
version = "0.2.0"
description = "wongo (원고, 'manuscript') — Python package and CLI for a verified Quarto-to-journal manuscript pipeline (journal profiles, submission-grade DOCX, Word-coauthor round-tripping)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Hoo Hugo Kim", email = "hookim@kist.re.kr" }]
keywords = ["quarto", "manuscript", "docx", "journal", "publishing", "reproducible-research", "research-software", "pipeline-framework"]
dependencies = [
  "PyYAML>=6",
  "python-docx>=1.1",
]

[project.scripts]
wongo = "wongo.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wongo"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E4/E7/E9/F = ruff defaults; I = import order; UP = modern syntax; B = bugbear.
# Long lines are not enforced: profile.yml-adjacent strings and quirk comments
# are deliberately long. Repository-policy ignores EXE001/DTZ011 kept for the
# documented CLI invocation.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["EXE001", "DTZ011", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::FutureWarning"]
